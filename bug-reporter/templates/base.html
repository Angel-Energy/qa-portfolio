<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}БагТрекер{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='jira-style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <style>
        .flash {
            position: fixed;
            top: 72px;
            right: 16px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            z-index: 40;
            animation: slideIn 0.3s ease-out;
        }
        .flash-success {
            background: #D1FAE5;
            color: #065F46;
            border: 1px solid #A7F3D0;
        }
        .flash-error {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FECACA;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Description styles */
        .desc-h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1F2937;
            margin: 20px 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #E5E7EB;
        }
        .desc-h2 {
            font-size: 16px;
            font-weight: 600;
            color: #374151;
            margin: 16px 0 10px;
        }
        .desc-h3 {
            font-size: 14px;
            font-weight: 600;
            color: #4B5563;
            margin: 12px 0 8px;
        }
        .desc-hr {
            border: none;
            border-top: 1px solid #E5E7EB;
            margin: 16px 0;
        }
        .desc-meta {
            display: flex;
            gap: 8px;
            margin: 6px 0;
            font-size: 14px;
        }
        .desc-meta strong {
            color: #6B7280;
            min-width: 120px;
        }
        .desc-p {
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.6;
        }
        .desc-code {
            background: #F3F4F6;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            color: #DC2626;
            border: 1px solid #E5E7EB;
        }
        .desc-link {
            color: #2563EB;
            text-decoration: underline;
            word-break: break-all;
        }
        .desc-link:hover {
            color: #1D4ED8;
        }
    </style>

    {% block scripts %}{% endblock %}
</body>
</html>
