{% extends "base.html" %}
{% block breadcrumb %}{{ bug.key }} — Редактировать{% endblock %}
{% block content %}

<div class="main-content" style="max-width: 900px; margin: 0 auto;">
    <div class="issue-header">
        <h1 class="issue-title" style="margin-bottom: 0;">Редактировать {{ bug.key }}</h1>
    </div>
    <div class="issue-body">

        <form method="POST">
            <div class="form-group">
                <label for="title">Заголовок *</label>
                <input type="text" id="title" name="title" required value="{{ bug.title }}">
            </div>

            <div class="form-row-3">
                <div class="form-group">
                    <label for="project">Проект</label>
                    <input type="text" id="project" name="project" value="{{ bug.project }}">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label for="url">URL проекта</label>
                    <input type="url" id="url" name="url" placeholder="https://example.com" value="{{ bug.url or '' }}">
                </div>
                <div class="form-group">
                    <label for="type">Тип</label>
                    <select id="type" name="type">
                        <option value="Функциональный" {% if bug.type == 'Функциональный' %}selected{% endif %}>Функциональный</option>
                        <option value="UI" {% if bug.type == 'UI' %}selected{% endif %}>UI</option>
                        <option value="Контент / UX" {% if bug.type == 'Контент / UX' %}selected{% endif %}>Контент / UX</option>
                        <option value="Серверный" {% if bug.type == 'Серверный' %}selected{% endif %}>Серверный</option>
                        <option value="Производительность" {% if bug.type == 'Производительность' %}selected{% endif %}>Производительность</option>
                        <option value="Безопасность" {% if bug.type == 'Безопасность' %}selected{% endif %}>Безопасность</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="component">Компонент</label>
                    <input type="text" id="component" name="component" value="{{ bug.component }}">
                </div>
            </div>

            <div class="form-row-3">
                <div class="form-group">
                    <label for="severity">Серьёзность</label>
                    <select id="severity" name="severity">
                        <option value="Critical" {% if bug.severity == 'Critical' %}selected{% endif %}>Critical</option>
                        <option value="Major" {% if bug.severity == 'Major' %}selected{% endif %}>Major</option>
                        <option value="Minor" {% if bug.severity == 'Minor' %}selected{% endif %}>Minor</option>
                        <option value="Trivial" {% if bug.severity == 'Trivial' %}selected{% endif %}>Trivial</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="priority">Приоритет</label>
                    <select id="priority" name="priority">
                        <option value="High" {% if bug.priority == 'High' %}selected{% endif %}>High</option>
                        <option value="Medium" {% if bug.priority == 'Medium' %}selected{% endif %}>Medium</option>
                        <option value="Low" {% if bug.priority == 'Low' %}selected{% endif %}>Low</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status">Статус</label>
                    <select id="status" name="status">
                        <option value="Open" {% if bug.status == 'Open' %}selected{% endif %}>Open</option>
                        <option value="Reported" {% if bug.status == 'Reported' %}selected{% endif %}>Reported</option>
                        <option value="In Progress" {% if bug.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                        <option value="Fixed" {% if bug.status == 'Fixed' %}selected{% endif %}>Fixed</option>
                        <option value="Closed" {% if bug.status == 'Closed' %}selected{% endif %}>Closed</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="assignee">Исполнитель</label>
                    <input type="text" id="assignee" name="assignee" value="{{ bug.assignee }}">
                </div>
                <div class="form-group">
                    <label for="reporter">Автор</label>
                    <input type="text" id="reporter" name="reporter" value="{{ bug.reporter }}">
                </div>
            </div>

            <div class="form-group">
                <label for="environment">Окружение</label>
                <textarea id="environment" name="environment" style="min-height: 80px;">{{ bug.environment }}</textarea>
            </div>

            <div class="form-group">
                <label for="preconditions">Предусловия</label>
                <textarea id="preconditions" name="preconditions" style="min-height: 80px;">{{ bug.preconditions }}</textarea>
            </div>

            <div class="form-group">
                <label for="steps">Шаги воспроизведения</label>
                <textarea id="steps" name="steps" style="min-height: 120px;">{{ bug.steps }}</textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="expected_result">Ожидаемый результат</label>
                    <textarea id="expected_result" name="expected_result" style="min-height: 80px;">{{ bug.expected_result }}</textarea>
                </div>
                <div class="form-group">
                    <label for="actual_result">Фактический результат</label>
                    <textarea id="actual_result" name="actual_result" style="min-height: 80px;">{{ bug.actual_result }}</textarea>
                </div>
            </div>

            <div class="form-group">
                <label for="user_impact">Влияние на пользователя</label>
                <textarea id="user_impact" name="user_impact" style="min-height: 60px;">{{ bug.user_impact }}</textarea>
            </div>

            <div class="form-group">
                <label for="root_cause">Предположение о причине</label>
                <textarea id="root_cause" name="root_cause" style="min-height: 60px;">{{ bug.root_cause }}</textarea>
            </div>

            <div class="form-group">
                <label for="recommendations">Рекомендации по исправлению</label>
                <textarea id="recommendations" name="recommendations" style="min-height: 60px;">{{ bug.recommendations }}</textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="labels">Метки (через запятую)</label>
                    <input type="text" id="labels" name="labels" value="{{ bug.labels }}">
                </div>
                <div class="form-group">
                    <label for="comments">Комментарии</label>
                    <textarea id="comments" name="comments" style="min-height: 60px;">{{ bug.comments }}</textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{{ url_for('bug_detail', bug_id=bug.id) }}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
cd tools/bug-reporter
.venv\Scripts\python.exe app.py
